<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lazy Sleep</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }

        .cover {
            width: 100vw;
            height: 100vh;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.25),
                    rgba(0, 0, 0, 0.45)
                ),
                url("./note/ml/lazy-sleep.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .content {
            text-align: center;
            color: white;

            animation: fadeIn 2s ease;
        }

        .title {
            font-size: 64px;
            font-weight: 600;
            letter-spacing: 8px;

            margin-bottom: 20px;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.7);
        }

        .subtitle {
            font-size: 16px;
            letter-spacing: 5px;

            margin-bottom: 50px;

            opacity: 0.85;
        }

        .enter {
            display: inline-block;

            padding: 15px 45px;

            color: white;
            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.8);

            font-size: 14px;
            letter-spacing: 4px;

            transition: all 0.4s ease;

            background: rgba(0, 0, 0, 0.15);

            backdrop-filter: blur(5px);
        }

        .enter:hover {
            background: white;
            color: black;

            transform: scale(1.05);

            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.4);
        }

        .footer {
            position: absolute;

            bottom: 30px;
            left: 0;
            right: 0;

            text-align: center;

            color: rgba(255, 255, 255, 0.65);

            font-size: 12px;

            letter-spacing: 2px;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media (max-width: 768px) {

            .title {
                font-size: 38px;
                letter-spacing: 5px;
            }

            .subtitle {
                font-size: 12px;
                letter-spacing: 3px;
            }

            .enter {
                padding: 13px 32px;
            }

        }
    </style>

</head>

<body>

    <div class="cover">

        <div class="content">

            <div class="title">
                LAZY SLEEP
            </div>

            <div class="subtitle">
                MY LEARNING BLOG
            </div>

            <a class="enter" href="./home.html">
                ENTER
            </a>

        </div>

        <div class="footer">
            KEEP LEARNING · KEEP THINKING
        </div>

    </div>

</body>

</html>
