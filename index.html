<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>学习笔记</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        /* =========================
           顶部图片
           ========================= */

        .hero {

            width: 100%;
            height: 55vh;

            min-height: 420px;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.35)
                ),
                url("./note/ml/lazy-sleep.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            align-items: flex-end;

            padding: 60px 8%;
        }

        .hero-title {

            color: white;

            font-size: 48px;

            font-weight: 600;

            letter-spacing: 4px;

            text-shadow:
                0 3px 20px rgba(0, 0, 0, 0.6);
        }


        /* =========================
           主体
           ========================= */

        .container {

            width: min(1000px, 90%);

            margin: 60px auto 100px;
        }


        .section-title {

            font-size: 28px;

            font-weight: 600;

            margin-bottom: 30px;
        }


        /* =========================
           笔记卡片
           ========================= */

        .notes {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 25px;
        }


        .note-card {

            display: block;

            padding: 30px;

            background: white;

            border-radius: 16px;

            text-decoration: none;

            color: #222;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.06);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .note-card:hover {

            transform:
                translateY(-6px);

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.12);
        }


        .note-type {

            font-size: 13px;

            color: #888;

            margin-bottom: 12px;
        }


        .note-name {

            font-size: 23px;

            font-weight: 600;

            margin-bottom: 12px;
        }


        .note-description {

            font-size: 14px;

            line-height: 1.8;

            color: #777;
        }


        /* =========================
           底部
           ========================= */

        .footer {

            text-align: center;

            padding: 40px 0;

            color: #aaa;

            font-size: 13px;
        }


        /* =========================
           手机端
           ========================= */

        @media (max-width: 700px) {

            .hero {

                height: 45vh;

                min-height: 320px;

                padding: 35px 7%;
            }

            .hero-title {

                font-size: 34px;

                letter-spacing: 2px;
            }

            .container {

                margin-top: 40px;
            }

        }

    </style>

</head>


<body>


    <!-- 顶部图片 -->

    <section class="hero">

        <div class="hero-title">

            学习笔记

        </div>

    </section>


    <!-- 主体 -->

    <main class="container">


        <div class="section-title">

            强化学习

        </div>


        <div class="notes">


            <!-- SAC -->

            <a
                class="note-card"
                href="https://github.com/jackpetpet/-/blob/main/note/ml/SAC.md"
                target="_blank"
            >

                <div class="note-type">
                    强化学习
                </div>

                <div class="note-name">
                    SAC 学习笔记
                </div>

                <div class="note-description">
                    Soft Actor-Critic，从最大熵强化学习到 Actor、Critic 与 Alpha 自动调节。
                </div>

            </a>


            <!-- TD3 -->

            <a
                class="note-card"
                href="https://github.com/jackpetpet/-/blob/main/note/ml/TD3学习笔记.md"
                target="_blank"
            >

                <div class="note-type">
                    强化学习
                </div>

                <div class="note-name">
                    TD3 学习笔记
                </div>

                <div class="note-description">
                    从 DDPG 到 TD3，理解 Double Critic、Target Policy Smoothing 与延迟更新。
                </div>

            </a>


            <!-- AlphaZero -->

            <a
                class="note-card"
                href="https://github.com/jackpetpet/-/blob/main/note/ml/alphazero-note.md"
                target="_blank"
            >

                <div class="note-type">
                    强化学习
                </div>

                <div class="note-name">
                    AlphaZero 学习笔记
                </div>

                <div class="note-description">
                    从蒙特卡洛树搜索到策略网络与价值网络，梳理 AlphaZero 的整体流程。
                </div>

            </a>


        </div>


    </main>


    <footer class="footer">

        学习 · 思考 · 记录

    </footer>


</body>

</html>
